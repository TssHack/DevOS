# DevOS live ISO — GRUB menu
#
# mkarchiso substitutes %ARCHISO_*%, %INSTALL_DIR%, %ARCH%, %KERNEL_PARAMS%.
# scripts/build-iso.sh substitutes %DEVOS_VERSION% and copies the theme to
# /boot/grub/themes/devos on the ISO. $root is the ISO volume (set by mkarchiso's
# embedded config).

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod udf

# --- Graphics ---------------------------------------------------------------
# Prefer the theme's design resolution; fall back to what the firmware offers.
insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png
insmod jpeg
set gfxmode=1920x1080,1600x900,1366x768,1280x800,1024x768,auto
set gfxpayload=keep

set devos_theme_dir="/boot/grub/themes/devos"
if loadfont "${devos_theme_dir}/devos-mono-16.pf2" ; then
    loadfont "${devos_theme_dir}/devos-mono-20.pf2"
    loadfont "${devos_theme_dir}/devos-mono-bold-20.pf2"
    if terminal_output gfxterm ; then
        set theme="${devos_theme_dir}/theme.txt"
    else
        terminal_output console
    fi
fi

# Text-mode fallback colours (no theme / console output)
set color_normal=light-gray/black
set color_highlight=black/cyan
set menu_color_normal=light-gray/black
set menu_color_highlight=black/cyan

# --- Platform ---------------------------------------------------------------
if [ "${grub_cpu}" == 'x86_64' ]; then
    uefi_machine_type_lower='x64'
elif [ "${grub_cpu}" == 'i386' ]; then
    uefi_machine_type_lower='ia32'
fi

default=devos
timeout=10
timeout_style=menu

# --- Entries ----------------------------------------------------------------
menuentry "DevOS %DEVOS_VERSION%  —  Live" --class devos --id 'devos' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet loglevel=3 rd.udev.log_level=3 %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "DevOS Live  —  Load into RAM" --class ram --id 'devos-ram' --hotkey r {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=y quiet loglevel=3 rd.udev.log_level=3 %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "DevOS Live  —  Safe graphics" --class safe --id 'devos-safe' --hotkey s {
    set gfxpayload=text
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

if [ "${grub_cpu}" == 'x86_64' -a -f '/boot/memtest86+/memtest.efi' ]; then
    menuentry 'Memory test' --class memtest --id 'memtest' --hotkey m {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest.efi
    }
fi

if [ -f "/shell${uefi_machine_type_lower}.efi" ]; then
    menuentry 'UEFI shell' --class shell --id 'uefi-shell' {
        chainloader /shell${uefi_machine_type_lower}.efi
    }
fi

menuentry 'UEFI firmware settings' --class firmware --id 'uefi-firmware' --hotkey f {
    fwsetup
}

menuentry 'Restart' --class reboot --id 'reboot' {
    reboot
}

menuentry 'Power off' --class shutdown --id 'poweroff' {
    halt
}
