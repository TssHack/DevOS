# devos-install --config example.conf   (SRS INST-007: unattended installs, e.g. VM tests)
# Parsed as KEY=VALUE, never executed. Prefer PASSWORD_HASH (openssl passwd -6) over PASSWORD.
DISK=/dev/vda
HOSTNAME=devos-vm
USERNAME=dev
PASSWORD_HASH=
PASSWORD=change-me
TIMEZONE=UTC
LOCALE=en_US.UTF-8
KEYMAP=us
ENCRYPT=no
LUKS_PASSWORD=
PROFILES=web
# Skip the "type the disk name" confirmation (automation only).
ASSUME_YES=yes
